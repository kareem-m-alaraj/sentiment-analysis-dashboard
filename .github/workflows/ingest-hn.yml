name: Ingest HN

on:
  schedule:
    - cron: "7 3,15 * * *"   # ~12h apart, off the hour to dodge scheduler load
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest-hn-live-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # match Streamlit Community Cloud

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-ingest-hn-${{ hashFiles('requirements-action.txt') }}

      - name: Install dependencies
        run: |
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-action.txt

      - name: Ingest HN stories
        run: python src/ingest_hn.py --sink parquet

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/hn/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Ingest HN stories $(date -u +%F)"
            git pull --rebase
            git push
          fi
